name: build-aic8800dc-x86_64

# 目标：为 kwrt 25.12-SNAPSHOT / kernel 6.12.116 / x86_64 编译 AIC8800 USB Wi-Fi 驱动
# 设备：UGREEN CM760 / AX300 (a69c:5722 光盘模式 -> a69c:88de WLAN 模式)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: 释放磁盘空间
        run: |
          exec > >(tee /tmp/diag.log) 2>&1
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          df -h /

      - name: 准备工具并下载 SDK
        run: |
          exec > >(tee -a /tmp/diag.log) 2>&1
          set -euxo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq zstd
          which zstd && zstd --version

          BASE="https://downloads.openwrt.org/releases/25.12.0/targets/x86/64"
          SDK="openwrt-sdk-25.12.0-x86-64_gcc-14.3.0_musl.Linux-x86_64.tar.zst"
          echo "--- 站点连通性 ---"
          curl -sI --max-time 30 "$BASE/" | head -5 || true

          echo "--- 下载 ---"
          curl -fL --retry 3 --retry-delay 5 --connect-timeout 30 \
               -o "$SDK" "$BASE/$SDK"
          ls -lh "$SDK"

          echo "--- 解压（zstd 管道，不依赖 tar --zstd）---"
          zstd -d -c "$SDK" | tar -xf -
          rm -f "$SDK"
          mv openwrt-sdk-* sdk
          ls sdk | head -20

      - name: 更新 feeds
        working-directory: sdk
        run: |
          exec > >(tee -a /tmp/diag.log) 2>&1
          set -euxo pipefail
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 集成 AIC8800DC 驱动包
        run: |
          exec > >(tee -a /tmp/diag.log) 2>&1
          set -euxo pipefail
          git clone --depth 1 https://github.com/kasonhaimen/openwrt-aic8800dc /tmp/aic
          find /tmp/aic -maxdepth 3 -type d | head -20
          mkdir -p sdk/package/kernel
          cp -a /tmp/aic/package/kernel/* sdk/package/kernel/
          mkdir -p out
          cp -a /tmp/aic/package/utils/usbmode/data/* out/ 2>/dev/null || true

          echo "--- 修正过期的 PKG_MIRROR_HASH ---"
          MK=sdk/package/kernel/aic8800dc/Makefile
          grep -nE "PKG_(MIRROR_)?HASH" "$MK" || true
          sed -i -E 's/^PKG_MIRROR_HASH:=.*/PKG_MIRROR_HASH:=skip/' "$MK"
          grep -qE '^PKG_MIRROR_HASH:=skip' "$MK" || echo 'PKG_MIRROR_HASH:=skip' >> "$MK"
          echo "--- 修正后 ---"
          grep -nE "PKG_(MIRROR_)?HASH" "$MK" || true

          echo "--- 关闭内核 CONFIG_WERROR ---"
          KCFG=sdk/target/linux/x86/config-6.12
          if [ -f "$KCFG" ]; then
            grep -v '^CONFIG_WERROR' "$KCFG" > "$KCFG.tmp" && mv "$KCFG.tmp" "$KCFG"
            echo '# CONFIG_WERROR is not set' >> "$KCFG"
            tail -2 "$KCFG"
          else
            echo "!! 未找到 $KCFG"
          fi

          echo "--- 给驱动编译加 -Wno-error=missing-prototypes ---"
          python3 - "$MK" <<'PY'
          import sys
          p = sys.argv[1]
          s = open(p, encoding='utf-8').read()
          if 'Wno-error=missing-prototypes' not in s:
              old = 'CONFIG_PLATFORM_UBUNTU=n \\'
              new = ('CONFIG_PLATFORM_UBUNTU=n \\\n'
                     '\t\tKCFLAGS="-Wno-error=missing-prototypes" \\\n'
                     '\t\tEXTRA_CFLAGS="-Wno-error=missing-prototypes" \\')
              assert old in s, 'anchor not found'
              s = s.replace(old, new, 1)
              open(p, 'w', encoding='utf-8').write(s)
          i = s.find('define Build/Compile')
          print(s[i:i+520])
          PY

          ls -l sdk/package/kernel/ out/

      - name: 编译
        working-directory: sdk
        run: |
          exec > >(tee -a /tmp/diag.log) 2>&1
          set -uo pipefail
          make defconfig
          make package/kernel/aic8800dc/compile V=s -j"$(nproc)" 2>&1 | tail -60

      - name: 收集产物并检查 vermagic
        if: always()
        run: |
          exec > >(tee -a /tmp/diag.log) 2>&1
          mkdir -p artifact
          find sdk/bin -name "*aic8800*.ipk" -exec cp -v {} artifact/ \; 2>/dev/null || true
          find sdk/bin -name "*.ko" -exec cp -v {} artifact/ \; 2>/dev/null || true
          cp -v out/* artifact/ 2>/dev/null || true
          ls -lh artifact/ || true
          echo "=== vermagic ==="
          for f in artifact/*.ko; do
            [ -f "$f" ] || continue
            echo "$f -> $(strings "$f" | grep -m1 '^vermagic=')"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: aic8800dc-ipk
          path: artifact/
          if-no-files-found: warn

      - name: 失败时把诊断日志推到 ci-logs 分支
        if: failure() || cancelled()
        run: |
          set +e
          tail -300 /tmp/diag.log 2>/dev/null || echo "no diag.log"
          git config --global user.name "ci-bot"
          git config --global user.email "ci-bot@users.noreply.github.com"
          rm -rf /tmp/clone
          git clone --depth 1 \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" /tmp/clone
          cd /tmp/clone
          git checkout -B ci-logs
          cp /tmp/diag.log diag.txt 2>/dev/null || echo "no diag" > diag.txt
          df -h >> diag.txt
          git add diag.txt
          git commit -m "ci diag $(date -u +%FT%TZ)" || true
          git push -f origin ci-logs
